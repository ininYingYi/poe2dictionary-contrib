name: Notify Main Repo

on:
  push:
    branches: [main]
    paths:
      - 'en/**'
      - 'zh/**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync in main repo
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.MAIN_REPO_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ininYingYi/poe2dictionary/dispatches \
            -d '{"event_type":"community-docs-updated"}'
